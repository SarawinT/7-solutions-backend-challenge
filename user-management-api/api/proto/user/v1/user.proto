syntax = "proto3";

package user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/SarawinT/user-management-api/gen/go/user/v1;userv1";

// UserService manages existing users. Accounts are created with
// auth.v1.AuthService/Register.
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {
  // Maximum number of users to return. Defaults to 20, capped at 100.
  int32 page_size = 1;
  // Zero-based page index.
  int32 page = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}

message UpdateUserRequest {
  string id = 1;
  // Only fields that are set are updated.
  optional string name = 2;
  optional string email = 3;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {}
